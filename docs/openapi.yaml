openapi: 3.0.3

info:
  title: demo-project API
  version: 1.0.0
  description: |
    Учебный API: регистрация, вход, обновление токенов, выход, профиль, посты.

    **Токены.** Login возвращает пару JWT: `access_token` (15 минут) и `refresh_token` (30 дней).
    Access передаётся в заголовке `Authorization: Bearer <access_token>`.
    Оба токена пары привязаны к одной сессии в Redis: после `refresh` или `logout`
    старые access и refresh сразу перестают действовать.

    **Ошибки** всегда приходят в формате `{"error": "текст"}`.

servers:
  - url: http://localhost:8080
    description: локальный запуск (make run)

tags:
  - name: auth
    description: регистрация, вход, токены
  - name: users
    description: пользователи
  - name: posts
    description: посты пользователей

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Регистрация
      description: |
        Email приводится к нижнему регистру. При регистрации можно выбрать только роль `user`:
        `admin`, `moderator` и другие служебные роли назначает администратор.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email already registered
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход
      description: Неизвестный email и неверный пароль дают одну и ту же ошибку.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid email or password
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Обновить пару токенов
      description: |
        Refresh-токен одноразовый. Старая сессия удаляется, создаётся новая:
        старые access и refresh сразу перестают действовать.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Выход
      description: |
        Удаляет сессию: access и refresh этой пары сразу перестают действовать.
        Повторный вызов с тем же токеном — тоже `204`.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Сессия закрыта
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me:
    get:
      tags: [users]
      summary: Текущий пользователь
      description: Пользователь определяется по access-токену.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Нет токена, токен недействителен или сессия закрыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    error: missing bearer token
                invalid:
                  value:
                    error: invalid or expired token
        '404':
          description: Пользователь удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not found
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts:
    get:
      tags: [posts]
      summary: Список постов
      description: Доступно без токена. Новые посты первыми. Если постов нет, возвращается пустой массив `[]`.
      operationId: listPosts
      responses:
        '200':
          description: Список постов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [posts]
      summary: Создать пост
      description: Автор — пользователь из access-токена. Пробелы по краям title и content обрезаются.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '201':
          description: Пост создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [posts]
      summary: Получить пост по id
      description: Доступно без токена.
      operationId: getPost
      responses:
        '200':
          description: Пост
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/InvalidID'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [posts]
      summary: Изменить пост
      description: |
        Только автор поста. Порядок проверок: пост существует (`404`), принадлежит пользователю
        из токена (`403`), данные проходят валидацию (`400`). Поле `updated_at` обновляется,
        `created_at` и `user_id` не меняются.
      operationId: updatePost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Обновлённый пост
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [posts]
      summary: Удалить пост
      description: |
        Только автор поста. Порядок проверок: пост существует (`404`),
        принадлежит пользователю из токена (`403`).
      operationId: deletePost
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Пост удалён
        '400':
          $ref: '#/components/responses/InvalidID'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    PostId:
      name: id
      in: path
      required: true
      description: id поста, целое число от 1
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access_token из ответа login или refresh

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
          example: ivan@mail.com
        password:
          type: string
          format: password
          minLength: 8
          description: от 8 символов и не больше 72 байт (ограничение bcrypt)
          example: secret123
        name:
          type: string
          description: не пустое после обрезки пробелов
          example: Иван
        role:
          type: string
          enum: [user]
          description: при регистрации доступна только роль user
          example: user

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ivan@mail.com
        password:
          type: string
          format: password
          example: secret123

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
          description: JWT на 15 минут, передаётся в заголовке Authorization
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: JWT на 30 дней, одноразовый, только для /auth/refresh и /auth/logout
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    User:
      type: object
      required: [id, email, name, role_id, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: ivan@mail.com
        name:
          type: string
          example: Иван
        role_id:
          type: integer
          format: int64
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2026-10-21T12:00:00Z'

    PostRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: от 1 до 200 символов после обрезки пробелов
          example: Мой первый пост
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: от 1 до 10 000 символов после обрезки пробелов
          example: Привет, мир!

    Post:
      type: object
      required: [id, user_id, title, content, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        user_id:
          type: integer
          format: int64
          description: автор поста
          example: 7
        title:
          type: string
          example: Мой первый пост
        content:
          type: string
          example: Привет, мир!
        created_at:
          type: string
          format: date-time
          example: '2026-10-21T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-21T12:00:00Z'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Битый JSON или данные не прошли проверку
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidJSON:
              value:
                error: invalid json body
            invalidInput:
              value:
                error: 'invalid input: password must be at least 8 characters'

    InvalidID:
      description: id в пути не число или меньше 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid id

    Forbidden:
      description: Пост существует, но принадлежит другому пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: forbidden

    NotFound:
      description: Поста с таким id нет
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found

    InvalidToken:
      description: Токен недействителен, истёк, не того типа или его сессия уже закрыта
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid or expired token

    InternalError:
      description: Внутренняя ошибка сервера. Подробности — только в логе
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error
